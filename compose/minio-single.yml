services:
  minio-single:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio-single
    restart: unless-stopped
    command: server /data --console-address ":9001" --certs-dir /root/.minio/certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-glynacadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-glynacinternpass2026}
    volumes:
      - ../data/minio-single:/data
      - ../certs:/root/.minio/certs:ro
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - migration-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  migration-net:
    external: true
